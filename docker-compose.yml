version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smart_cooling_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: smart_cooling
      MYSQL_USER: cooling_user
      MYSQL_PASSWORD: cooling_password
    ports:
      - "3306:3306" 
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: smart_cooling_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://cooling_user:cooling_password@db:3306/smart_cooling
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: smart_cooling_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
